# Profil « groq » : API Groq (compatible OpenAI) via le starter OpenAI déjà présent.
# Clé API (console.groq.com) dans la variable d'environnement GROQ_API_KEY, JAMAIS dans Git.
# Lancer avec --spring.profiles.active=groq ; changer de modèle : -Dspring.ai.openai.chat.model=...
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:cle-non-renseignee}
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.temperature=0.3
# Groq refuse le champ « reasoning_content » rejoué par Spring AI 2.0.0 (400) : voir ai/ModeleSansRaisonnement (actif avec ce profil).

# Les modèles de raisonnement de Groq confondent « répondre en JSON » et un appel d'outil nommé JSON quand outils et sortie structurée
# sont demandés ensemble. Le vétérinaire et le gardien travaillent alors en deux temps : outils + texte libre, puis conversion en JSON.
agents.sortie-en-deux-temps=true
