# Profil « jeu » : la clinique se connecte au serveur MCP du jeu (module jeu-bestiaire, à démarrer d'abord).
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=gribouille
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.streamable-http.connections.jeu.url=${JEU_URL:http://localhost:8090}
# Une partie fait beaucoup d'appels de modèle : budget de tokens relevé pour l'agent ReAct (par défaut 20000).
agent.budget-tokens=200000
jeu.url=${JEU_URL:http://localhost:8090}
