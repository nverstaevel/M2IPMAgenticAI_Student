# Profil « claude » : API Claude via le starter Anthropic de Spring AI (SDK Java officiel d'Anthropic).
# Clé API (Claude Console) dans la variable d'environnement ANTHROPIC_API_KEY, JAMAIS dans Git.
# Lancer avec --spring.profiles.active=claude ; changer de modèle : -Dspring.ai.anthropic.chat.model=...
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:cle-non-renseignee}
spring.ai.anthropic.chat.model=claude-haiku-5-5
spring.ai.anthropic.chat.max-tokens=4096
# Pas de « temperature », « top-p » ni « top-k » : ces réglages sont ignorés par le module (avertissement dans les journaux).
