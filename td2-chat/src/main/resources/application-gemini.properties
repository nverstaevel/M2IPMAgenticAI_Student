# Profil « gemini » : API Gemini (Google AI Studio) via le starter Google GenAI de Spring AI.
# Clé API (aistudio.google.com) dans la variable d'environnement GEMINI_API_KEY, JAMAIS dans Git.
# Lancer avec --spring.profiles.active=gemini ; changer de modèle : -Dspring.ai.google.genai.chat.model=...
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:cle-non-renseignee}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.3

# Traces réseau du SDK Google : requêtes et statuts HTTP (200, 404, 503…), nouvelles tentatives
logging.level.com.google.genai=DEBUG
logging.level.org.apache.hc.client5.http.headers=DEBUG
