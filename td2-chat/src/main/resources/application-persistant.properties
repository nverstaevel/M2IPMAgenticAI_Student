# Profil « persistant » : base H2 sur fichier, la conversation survit à un redémarrage.
# Premier lancement : ajouter --spring.sql.init.mode=always pour charger data.sql une seule fois.
spring.datasource.url=jdbc:h2:file:./data/clinique
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
