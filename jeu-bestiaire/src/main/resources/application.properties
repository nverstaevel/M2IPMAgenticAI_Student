spring.application.name=jeu-bestiaire
server.port=8090

# ---- Serveur MCP : transport Streamable HTTP, endpoint /mcp
spring.ai.mcp.server.name=bestiaire
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

# ---- Règles de la partie : même graine = mêmes patients
jeu.graine=42
jeu.jours=5
jeu.arrivees-par-jour=3
