name: ci
# Vérifie que chaque point de départ compile (main + tests). Les tests des squelettes échouent volontairement : on ne les lance pas ici.
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dossier: [td1-clinique, td2-chat, td3-outils-externes, td4-agent-react, td5-agents-roles, td6-mcp-jeu, jeu-bestiaire]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -f "${{ matrix.dossier }}/pom.xml" -DskipTests test-compile
      - name: Tests du jeu (fourni)
        if: matrix.dossier == 'jeu-bestiaire'
        run: mvn -B -f jeu-bestiaire/pom.xml test
