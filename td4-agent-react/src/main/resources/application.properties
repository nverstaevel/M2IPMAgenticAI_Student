spring.application.name=clinique-fantastique
spring.datasource.url=jdbc:h2:mem:clinique;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# data.sql est exécuté après la création du schéma par Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Spring AI : deux starters sont présents (Ollama et OpenAI-compatible), un seul modèle est actif.
# Choix par défaut : Ollama. Pour LM Studio ou une API compatible OpenAI : profil « lmstudio ».
spring.ai.model.chat=ollama
# Le starter OpenAI (SDK officiel) exige une clé même inutilisée : valeur factice par défaut, jamais de vraie clé dans Git.
spring.ai.openai.api-key=${OPENAI_API_KEY:cle-non-renseignee}
# Seul le chat est utilisé : on désactive les autres modèles que les starters déclarent.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.temperature=0.3

# ---- Mémoire de conversation : dépôt JDBC (table SPRING_AI_CHAT_MEMORY)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# ---- Journal de débogage : voir les appels d'outils
logging.level.org.springframework.ai=DEBUG

# Durée de validité d'une proposition de consultation
clinique.proposition.ttl=PT10M
agent.traces.dir=traces
agent.budget-tokens=20000

# ---- Traçabilité : ce que fait l'application (question, appels de modèle, outils, durées)
logging.level.fr.m2ipm.clinique=DEBUG
# Texte renvoyé par le modèle à chaque tour, et arguments/résultats de chaque outil appelé
spring.ai.chat.observations.log-completion=true
spring.ai.tools.observations.include-content=true
