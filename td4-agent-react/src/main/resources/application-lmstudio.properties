# Profil « lmstudio » : serveur compatible OpenAI (LM Studio par défaut, port 1234).
# Lancer avec --spring.profiles.active=lmstudio ; surcharger le nom du modèle dans application-local.yml
# (le nom exact est affiché par LM Studio, onglet « Developer »).
spring.ai.model.chat=openai
# Le SDK OpenAI attend l'URL complète, /v1 compris (à vérifier avec votre serveur).
spring.ai.openai.base-url=http://localhost:1234/v1
spring.ai.openai.api-key=lm-studio
spring.ai.openai.chat.model=qwen2.5-7b-instruct
spring.ai.openai.chat.temperature=0.3
