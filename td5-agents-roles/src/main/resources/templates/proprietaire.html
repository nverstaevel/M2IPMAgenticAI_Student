<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: entete(${proprietaire.nom})}"></head>
<body>
<nav th:replace="~{fragments :: menu}"></nav>
<h1 th:text="${proprietaire.prenom} + ' ' + ${proprietaire.nom}">Propriétaire</h1>
<p th:text="${proprietaire.ville} + ' — ' + ${proprietaire.telephone}">Ville</p>

<div th:each="c : ${creatures}">
  <h2 th:text="${c.nom} + ' (' + ${c.espece} + ', né(e) le ' + ${c.dateNaissance} + ')'">Créature</h2>
  <a th:href="@{/consultations/nouvelle(creatureId=${c.id})}">Nouvelle consultation</a>
  <table>
    <thead><tr><th>Date</th><th>Soigneur</th><th>Motif</th><th>Diagnostic</th><th>Traitement</th><th>Tarif</th></tr></thead>
    <tbody>
      <tr th:each="k : ${historiques[c.id]}">
        <td th:text="${#temporals.format(k.dateHeure, 'dd/MM/yyyy HH:mm')}">date</td>
        <td th:text="${k.soigneurNom}">soigneur</td>
        <td th:text="${k.motif}">motif</td>
        <td th:text="${k.diagnostic} ?: '—'">diag</td>
        <td th:text="${k.traitement} ?: '—'">trait</td>
        <td th:text="${k.tarif}">tarif</td>
      </tr>
      <tr th:if="${#lists.isEmpty(historiques[c.id])}"><td colspan="6">Aucune consultation.</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
